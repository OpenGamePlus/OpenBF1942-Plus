<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">OpenBF1942-Plus</title>
  <desc id="desc">A clean-room Refractor 1 engine that runs Battlefield 1942 from your own installation</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a7a"/>
      <stop offset="0.65" stop-color="#b9a67c"/>
      <stop offset="1" stop-color="#d8c28e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#sky)"/>
  <path d="M0 200 L140 170 L260 185 L420 150 L560 178 L700 160 L860 182 L1000 158 L1200 176 L1200 260 L0 260 Z" fill="#a8925f" opacity="0.8"/>
  <path d="M0 225 L1200 215 L1200 260 L0 260 Z" fill="#7d6a43"/>
  <!-- a stylised tank silhouette -->
  <g fill="#2b2a22" transform="translate(860 168)">
    <rect x="0" y="22" width="190" height="26" rx="12"/>
    <rect x="18" y="6" width="150" height="20" rx="4"/>
    <rect x="60" y="-10" width="70" height="20" rx="6"/>
    <rect x="128" y="-4" width="110" height="7" rx="3"/>
  </g>
  <text x="70" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="bold" fill="#f4ecd6" stroke="#2b2a22" stroke-width="2">OpenBF1942-Plus</text>
  <text x="74" y="162" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#f4ecd6">Refractor 1, rebuilt from scratch · bring your own Battlefield 1942</text>
  <rect x="10" y="10" width="1180" height="240" rx="9" fill="none" stroke="#f4ecd6" stroke-opacity="0.4" stroke-width="2"/>
</svg>
