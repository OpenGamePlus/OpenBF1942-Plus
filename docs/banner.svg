<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
<title id="t">OpenBF1942-Plus</title>
<desc id="d">A clean-room Refractor 1 engine that runs Battlefield 1942 from your own installation</desc>
<!-- Fonts: Stardos Stencil and Oswald (SIL Open Font License), subset to the banner text -->
<defs>
<style>@font-face{font-family:'Stardos Stencil';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Oswald';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <clipPath id="card"><rect width="1200" height="260" rx="14"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#24324f"/><stop offset=".45" stop-color="#6b6a78"/><stop offset=".75" stop-color="#d79a5c"/><stop offset="1" stop-color="#f2c27a"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2c8"/><stop offset=".4" stop-color="#ffd27c" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/></radialGradient>
  <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9935e"/><stop offset="1" stop-color="#a87648"/></linearGradient>
  <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c6e44"/><stop offset="1" stop-color="#7a5434"/></linearGradient>
  <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4a30"/><stop offset="1" stop-color="#3e2b1e"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e2"/><stop offset="1" stop-color="#ead2a4"/></linearGradient>
  <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a2c24" stop-opacity=".6"/><stop offset="1" stop-color="#3a2c24" stop-opacity="0"/></linearGradient>
  <linearGradient id="shade" x1="0" x2="1"><stop offset="0" stop-color="#0e1424" stop-opacity=".55"/><stop offset=".55" stop-color="#0e1424" stop-opacity="0"/></linearGradient>
  <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="tdrop"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a1210" flood-opacity=".75"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="table" tableValues="0 0.07"/></feComponentTransfer>
  <feComposite in2="SourceGraphic" operator="in"/>
</filter>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="260" fill="url(#sky)"/>
  <circle cx="1020" cy="170" r="120" fill="url(#sun)"/>
  <circle cx="1020" cy="170" r="30" fill="#fff4d6" opacity=".9"/>
  <!-- clouds -->
  <g fill="#f6d8b0" opacity=".25" filter="url(#blur12)"><ellipse cx="820" cy="80" rx="160" ry="14"/><ellipse cx="1080" cy="110" rx="120" ry="10"/><ellipse cx="560" cy="60" rx="140" ry="10"/></g>
  <g transform="translate(1040 44) scale(0.5)" fill="#2a1f1a" opacity="0.8">
  <path d="M-40 0 Q-30 -5 20 -4 L34 -2 Q38 0 34 2 L20 4 Q-30 5 -40 0 Z"/>
  <path d="M-6 -3 L4 -3 L-2 -34 L-12 -34 Z"/><path d="M-6 3 L4 3 L-2 34 L-12 34 Z"/>
  <path d="M-36 -1 L-30 -1 L-38 -12 L-44 -12 Z"/><path d="M-36 1 L-30 1 L-38 12 L-44 12 Z"/>
  <rect x="34" y="-9" width="2" height="18"/></g>
  <g transform="translate(1110 68) scale(0.36)" fill="#2a1f1a" opacity="0.65">
  <path d="M-40 0 Q-30 -5 20 -4 L34 -2 Q38 0 34 2 L20 4 Q-30 5 -40 0 Z"/>
  <path d="M-6 -3 L4 -3 L-2 -34 L-12 -34 Z"/><path d="M-6 3 L4 3 L-2 34 L-12 34 Z"/>
  <path d="M-36 -1 L-30 -1 L-38 -12 L-44 -12 Z"/><path d="M-36 1 L-30 1 L-38 12 L-44 12 Z"/>
  <rect x="34" y="-9" width="2" height="18"/></g>
  <g transform="translate(975 30) scale(0.28)" fill="#2a1f1a" opacity="0.5">
  <path d="M-40 0 Q-30 -5 20 -4 L34 -2 Q38 0 34 2 L20 4 Q-30 5 -40 0 Z"/>
  <path d="M-6 -3 L4 -3 L-2 -34 L-12 -34 Z"/><path d="M-6 3 L4 3 L-2 34 L-12 34 Z"/>
  <path d="M-36 -1 L-30 -1 L-38 -12 L-44 -12 Z"/><path d="M-36 1 L-30 1 L-38 12 L-44 12 Z"/>
  <rect x="34" y="-9" width="2" height="18"/></g>
  <!-- dunes -->
  <path d="M0 200 Q160 170 340 190 T700 182 T1000 176 T1200 186 L1200 260 L0 260 Z" fill="url(#d1)"/>
  <path d="M0 220 Q220 196 470 214 T900 206 T1200 214 L1200 260 L0 260 Z" fill="url(#d2)"/>
  <!-- tank -->
  <g transform="translate(955 204) scale(.85)" fill="#221a15">
    <path d="M0 22 Q-6 30 4 38 L168 38 Q178 30 172 22 Z"/>
    <path d="M6 6 L166 6 L176 22 L-4 22 Z"/>
    <path d="M40 -16 L128 -16 L140 6 L30 6 Z"/>
    <rect x="128" y="-10" width="120" height="7" rx="2"/>
    <rect x="240" y="-12" width="12" height="11" rx="2"/>
    <rect x="70" y="-24" width="30" height="10" rx="3"/>
    <g fill="#3a2c22"><circle cx="14" cy="30" r="7"/><circle cx="35" cy="30" r="7"/><circle cx="56" cy="30" r="7"/><circle cx="77" cy="30" r="7"/><circle cx="98" cy="30" r="7"/><circle cx="119" cy="30" r="7"/><circle cx="140" cy="30" r="7"/><circle cx="161" cy="30" r="7"/></g>
  </g>
  <path d="M0 238 Q260 222 560 236 T1200 232 L1200 260 L0 260 Z" fill="url(#d3)"/>
  <rect width="1200" height="260" fill="url(#shade)"/>
  <!-- text -->
  <text x="70" y="120" font-family="'Stardos Stencil', Impact, sans-serif" font-weight="700" font-size="82" fill="url(#title)" filter="url(#tdrop)" letter-spacing="1">OpenBF1942<tspan fill="#f2b766">-Plus</tspan></text>
  <g transform="translate(72 140)"><rect width="64" height="4" fill="#f2b766"/><rect x="72" y="1.5" width="420" height="1" fill="#fff6e2" opacity=".45"/></g>
  <text x="72" y="178" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="500" font-size="25" fill="#fff4de" letter-spacing="1" filter="url(#tdrop)">REFRACTOR 1, REBUILT FROM SCRATCH <tspan fill="#f2b766">·</tspan> BRING YOUR OWN BATTLEFIELD 1942</text>
  <rect width="1200" height="260" filter="url(#grain)"/>
</g>
<rect x="1" y="1" width="1198" height="258" rx="13" fill="none" stroke="#fff2d8" stroke-opacity=".4" stroke-width="2"/>
</svg>